# Reset rules and tracked routines. Times in UTC.
# Edit freely: remove what you don't do, add what's missing.

resets:
  daily: "07:00"        # in-game 2026-10-10
  weekly: { day: wednesday, time: "07:00" }   # in-game 2026-10-10 (Daily Dungeon countdown)

# Fields: id (used in the log), name, reset (daily|weekly), cap (default 1), characters (default: all), notes
# Caps are from early guides — confirm in-game and correct here.
routines:
  - id: duty
    name: Duty Missions
    notes: Does NOT bank, lost at the daily reset (in-game 2026-10-13). Journal (J) → Duty tab. Pick by guaranteed slot-1 reward; Soul Crystal > Odyle Energy > tickets > Kina (guides). Per server or account. Details: knowledge/endgame.md.
    reset: daily
    cap: 5

  - id: nightmare
    name: Nightmare
    reset: daily
    cap: 2
    notes: Attempt only consumed on a clear. Unused attempts bank up to 14.

  - id: odyle
    name: Spend Odyle Energy
    reset: daily
    notes: Regens 15 per 3h (120/day), cap 560. Spent on reward cubes - Exploration 20–40, Conquest 40, later Transcendence 40 (see knowledge/expeditions.md). Don't let it cap. Always open the cube after a Conquest clear: leaving without it lowers the weekly "unobtained cube" count (10, at 0 no Conquest/Transcendence).

  - id: daily-dungeon
    name: Daily Dungeon
    reset: weekly
    cap: 14
    notes: Solo. 14 tickets/week, cap 14 (in-game). Shared server pool across characters. 6–7k Enhance Stones per clear on average (in-game, GS 1100–1500; guides say ~10k, score-based), the top stone source.

  - id: ascension
    name: Ascension Trial
    reset: weekly
    cap: 3
    notes: Difficulties by GS - Easy 1000, Normal 1500, Hard 2000, Extreme 2500 (in-game). 3,500 Enhance Stones per clear on Normal (in-game 2026-10-15).

  - id: commands
    name: Command Scrolls (PvE)
    notes: Journal → Duty → Commands (in-game). Bought from the Command Merchant in the capital. Common 15,000 Kina → 1,000 Abyss Points + random extras (AP, Enhance Stones) (in-game). Cap 12/week (in-game).
    reset: weekly
    cap: 12

  - id: siege
    name: Artifact Siege (Abyss)
    notes: Mon, Thu, Sat 21:00, 30 min (Sat + Mon in-game). Countdown "Next Siege in" on the Chaotic Lower Reshanta card. Mass faction PvP at 3 Artifacts; final hit on a Dimensional Core takes it. Optional, go with a group. Details knowledge/abyss.md.
    reset: weekly
    cap: 3

  - id: corridor
    name: Abyss Corridor run
    notes: Only while Elyos hold an Artifact (map panel "Artifact Siege"; map icon + teleport). Arena with endless spawns, AP per kill, ~10k AP per run (in-game 2026-10-18). One allowance per siege (02:10 seen), used up in one go. Entrance can be camped by Asmodians. Cap 3 = one per siege; likely one corridor per held Artifact (unconfirmed), so log the real count. A lost siege means no corridor, that's fine.
    reset: weekly
    cap: 3

  - id: battlefield
    name: Battlefield (Arena of Tactics, 10v10)
    notes: Own Battlefield window. Daily 11:00–14:00 and 19:00–21:00 (in-game). Rewards per week max 3 victory (3,000 AP + 2 items) + 3 participation (1,000 AP + 1 item), reset Wednesday; up to ~12k AP. Solo queue or a full 5-party. Cap 6 = matches; log matches, note wins.
    reset: weekly
    cap: 6

  - id: abyss-commands
    name: Abyss Command Scrolls (Common)
    notes: Command Shop in Latesran Western Root (Abyss). Common 15,000 Kina → 1,000 AP + 200 Abyssal Power Shards + 1–5 random (AP, Enhance Stones). 5/week per server, weekly reset (in-game 2026-10-18). Log when the missions are done, not when bought. Higher grades (37.5k / 75k / 150k) not tracked.
    reset: weekly
    cap: 5

  - id: shugo
    name: Shugo Festival (use keys)
    reset: daily
    cap: 3
    notes: Every hour at :00. +3 keys/day, banks to 12 (per account + server), so no rush until near 12.

  - id: supply-daily
    name: Supply Requests, Emergency tab
    reset: daily
    notes: Esc → Supply Requests (in-game name; not Abyss content, in-game 2026-10-18). Doing all of them isn't realistic; cap 1 = "did some", log the real count. Hand in Silentium (keep it, don't sell) or matching gear. AP + Enhance Stones (in-game 2026-10-18). Details knowledge/abyss.md (amounts: guides, unverified).

  - id: supply-weekly
    name: Supply Requests, Weekly tab
    reset: weekly
    notes: Same window, Weekly tab. Cap 1 = "did some", partial is fine. Check the Boss tab before salvaging field boss gear. Resets at the normal weekly reset (in-game 2026-10-18).

  - id: halloween
    name: Halloween weekly quests (event, until 2026-11-04)
    reset: weekly
    notes: Claim the 10 weekly event quests (235 Pumpkin Coins/week, per server). List in knowledge/events.md (in-game 2026-10-14). Spend: chest (250, once) first, then Shugo keys, Nightmare tickets, Daily Dungeon clears, Odyle Energy; weekly limits don't carry over. Remove after the event.

  - id: invasion
    name: Dimensional Invasion (use key)
    reset: daily
    notes: Every hour at :30, ~5 min. Only worth it with a key (no key = no rewards, in-game). +1 key/day, banks to 7.
