# Reset rules and tracked routines. Times in UTC.
# Edit freely: remove what you don't do, add what's missing.

resets:
  daily: "07:00"        # in-game 2026-10-10
  weekly: { day: wednesday, time: "07:00" }   # in-game 2026-10-10 (Daily Dungeon countdown)

# Fields: id (used in the log), name, reset (daily|weekly), cap (default 1), characters (default: all), notes
# Caps are from early guides — confirm in-game and correct here.
routines:
  - id: duty
    name: Duty Missions
    notes: Journal (J) → Duty tab. Pick by guaranteed slot-1 reward; Soul Crystal > Odyle Energy > tickets > Kina (guides). Per server or account. Details: knowledge/endgame.md.
    reset: daily
    cap: 5

  - id: nightmare
    name: Nightmare
    reset: daily
    cap: 2
    notes: Attempt only consumed on a clear. Unused attempts bank up to 14.

  - id: odyle
    name: Spend Odyle Energy
    reset: daily
    notes: Regens 15 per 3h (120/day), cap 560. Spent on reward cubes - Exploration 20–40, Conquest 40, later Transcendence 40 (see knowledge/expeditions.md). Don't let it cap.

  - id: daily-dungeon
    name: Daily Dungeon
    reset: weekly
    cap: 14
    notes: Solo. 14 tickets/week, cap 14 (in-game). Shared server pool across characters. ~10,000 Enhance Stones per clear (score-based), the top stone source.

  - id: ascension
    name: Ascension Trial
    reset: weekly
    cap: 3
    notes: Difficulties by GS - Easy 1000, Normal 1500, Hard 2000, Extreme 2500 (in-game). ~3,500 Enhance Stones per clear (guides, difficulty not stated).

  - id: conquest
    name: Conquest cube opens
    reset: weekly
    cap: 10
    notes: 10 cube opens/week (in-game); at 0 you can't enter. Always open the cube after a clear, skipping still uses one. 40 Odyle each. Krao Cave + Draupnir at GS 700+.

  - id: commands
    name: Command Scrolls (PvE)
    notes: Journal → Duty → Commands (in-game). Bought from the Command Merchant in the capital, up to 12/week (guides). Worth it? Cost and rewards not checked yet.
    reset: weekly

  - id: shugo
    name: Shugo Festival (use keys)
    reset: daily
    cap: 3
    notes: Every hour at :00. +3 keys/day, banks to 12 (per account + server), so no rush until near 12.

  - id: invasion
    name: Dimensional Invasion (use key)
    reset: daily
    notes: Every hour at :30, ~5 min. Only worth it with a key (no key = no rewards, in-game). +1 key/day, banks to 7.
