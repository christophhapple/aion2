# Reset rules and tracked routines. Times in UTC.
# Edit freely: remove what you don't do, add what's missing.

resets:
  daily: "07:00"        # in-game 2026-10-10
  weekly: { day: wednesday, time: "07:00" }   # Wednesday: guides (consistent); time assumed same as daily

# Fields: id (used in the log), name, reset (daily|weekly), cap (default 1), characters (default: all), notes
# Caps are from early guides — confirm in-game and correct here.
routines:
  - id: duty
    name: Duty Missions
    notes: 50,000 Kinah + 1,000 Abyss Points each (guides). Per server.
    reset: daily
    cap: 5

  - id: nightmare
    name: Nightmare
    reset: daily
    cap: 2
    notes: Attempt only consumed on a clear. Unused attempts bank up to 14.

  - id: odyle
    name: Spend Odyle Energy
    reset: daily
    notes: Regens 15 per 3h (120/day), cap 560. Cubes cost 20–40 (see knowledge/expeditions.md). Don't let it cap.

  - id: daily-dungeon
    name: Daily Dungeon
    reset: weekly
    cap: 14
    notes: Shared server pool across characters. ~10,000 Enhance Stones per clear, the top stone source.

  - id: ascension
    name: Ascension Trial
    reset: weekly
    cap: 3
    notes: Needs GS ~1500 (unverified); ~3,500 Enhance Stones per clear.

  - id: weekly-quests
    name: Weekly quests
    reset: weekly

  - id: shugo
    name: Shugo Festival (use keys)
    reset: daily
    cap: 3
    notes: Every hour at :00. +3 keys/day, banks to 12 (per account + server), so no rush until near 12.

  - id: invasion
    name: Dimensional Invasion (use key)
    reset: daily
    notes: Every hour at :30. +1 key/day, banks to 7 (per account + server). Rewards from level 45.
