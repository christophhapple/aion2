# Reset rules and tracked routines. Times in UTC.
# Edit freely: remove what you don't do, add what's missing.

resets:
  daily: "07:00"        # in-game 2026-10-10
  weekly: { day: wednesday, time: "07:00" }   # in-game 2026-10-10 (Daily Dungeon countdown)

# Fields: id (used in the log), name, reset (daily|weekly), cap (default 1), characters (default: all), notes
# Caps are from early guides — confirm in-game and correct here.
routines:
  - id: duty
    name: Duty Missions
    notes: Does NOT bank, lost at the daily reset (in-game 2026-10-13). Journal (J) → Duty tab. Pick by guaranteed slot-1 reward: tickets > Soul Crystal > Odyle Energy > Kina (user 2026-10-22). Per server or account. Details - knowledge/endgame.md.
    reset: daily
    cap: 5

  - id: nightmare
    name: Nightmare
    reset: daily
    cap: 2
    notes: Attempt only consumed on a clear. Unused attempts bank up to 14. Season 1 weekly achievements (guides) - Friends With a Story at 5/10 boss kills a week, plus one each for a boss kill under 3 / 2 / 1 min. The 1-min kill has its own routine, nightmare-1min.

  - id: nightmare-1min
    name: Nightmare boss kill under 1 min (Season Mission)
    reset: weekly
    notes: Weekly Season Mission, Nightmare tab (in-game 2026-10-21). Lower the difficulty for one ticket so the kill is fast; that clear also counts as a normal nightmare run, log both.

  - id: odyle
    name: Spend Odyle Energy
    reset: daily
    notes: Regens 15 per 3h (120/day), cap 560. Spent on reward cubes - Exploration 20–40, Conquest 40, later Transcendence 40 (see knowledge/expeditions.md). Don't let it cap. Always open the cube after a Conquest clear - leaving without it lowers the weekly "unobtained cube" count (10, at 0 no Conquest/Transcendence).

  - id: daily-dungeon
    name: Daily Dungeon
    reset: weekly
    cap: 14
    notes: Solo. 14 tickets/week, cap 14 (in-game). Shared server pool across characters. Enhance Stones per clear on average 6–7k at GS 1100–1500, 7.5–8k at GS ~1900 (in-game), max 10k (score-based), the top stone source. No Kina (in-game 2026-10-23).

  - id: ascension
    name: Ascension Trial
    reset: weekly
    cap: 3
    notes: Difficulties by GS - Easy 1000, Normal 1500, Hard 2000, Extreme 2500 (in-game). 3,500 Enhance Stones per clear on Normal (in-game 2026-10-15). Season 1 weekly achievement Hatched Bird at 1/2/3 clears (guides).

  - id: commands
    name: Command Scrolls (PvE)
    notes: Journal → Duty → Commands (in-game). Bought from the Command Merchant in the capital. Common 15,000 Kina → 1,000 Abyss Points + random extras (AP, Enhance Stones) (in-game). Cap 12/week (in-game).
    reset: weekly
    cap: 12

  - id: siege
    name: Artifact Siege (Abyss)
    notes: Mon, Thu, Sat 21:00, 30 min (all three in-game); with the siege bosses after, ~1h of Abyss time (in-game 2026-10-22). Countdown "Next Siege in" on the Chaotic Lower Reshanta card. Mass faction PvP at 3 Artifacts; final hit on a Dimensional Core takes it. PvP is second priority since 2026-10-19 - join when online, ideally with a group, PvP preset (Batch Set 3). A won Artifact opens the corridor. Details knowledge/abyss.md.
    reset: weekly
    cap: 3

  - id: corridor
    name: Abyss Corridor run
    notes: Only while Elyos hold an Artifact (map panel "Artifact Siege"; map icon + teleport). Arena with endless spawns, AP per kill, ~10k AP per run (in-game 2026-10-18), ~17k each (in-game 2026-10-22). Allowance used up in one go. Entrance can be camped by Asmodians. One corridor per held Artifact, 02:10 each (in-game 2026-10-22), so after a 2-Artifact win there are two runs; log the real count. A lost siege means no corridor, that's fine.
    reset: weekly
    cap: 3

  - id: battlefield
    name: Battlefield (Arena of Tactics, 10v10)
    notes: Own Battlefield window. Daily 11:00–14:00 and 19:00–21:00 (in-game). Cap 3 = weekly Season Mission chain, steps at 1 / 2 / 3 matches (in-game 2026-10-19), and the 3 participation rewards (1,000 AP + 1 item). Solo queue or a full 5-party. Log every match played here, wins additionally as battlefield-win.
    reset: weekly
    cap: 3

  - id: battlefield-win
    name: Battlefield wins
    notes: Victory reward limit 3/week (3,000 AP + 2 items each). Up to ~12k AP/week with the participation rewards (own arithmetic). Log wins only; the same matches also go into battlefield.
    reset: weekly
    cap: 3

  - id: abyss-commands
    name: Abyss Command Scrolls (all four grades)
    notes: Command Shop in Latesran Western Root (Abyss). 5/week per grade per server, weekly reset (in-game 2026-10-18). Common 15,000 Kina → 1,000 AP + 200 Abyssal Power Shards + 1–5 random (AP, Enhance Stones). Green 37,500 → 1,000 AP + 400 Abyssal Power Shards + random (chance at a Radiant Ruby). Epic 75,000, Unique 150,000 (in-game 2026-10-20). All 20 every week, for the AP (user 2026-10-23), ~1.4M Kina at list price. Do them alongside the siege and Watcher Kaira so they cost little extra Abyss time. Weekly Season Mission chain 3/6/10 Abyss commands. Log when the missions are done, not when bought.
    reset: weekly
    cap: 20

  - id: shugo
    name: Shugo Festival (use keys)
    reset: daily
    cap: 3
    notes: Every hour at :00. +3 keys/day, banks to 12, 21 with membership (since 2026-10-22) (per account + server), so no rush until near the cap. What matters is spending the keys, not the run count (user, 2026-10-19) - log the keys left when given, don't reconcile runs or flag missing ones.

  - id: supply-daily
    name: Supply Requests, Emergency tab
    reset: daily
    notes: Esc → Supply Requests (in-game name; not Abyss content, in-game 2026-10-18). Doing all of them isn't realistic; cap 1 = "did some", log the real count. Hand in Silentium (keep it, don't sell) or matching gear. AP + Enhance Stones (in-game 2026-10-18). Details knowledge/abyss.md (amounts - guides, unverified).

  - id: supply-weekly
    name: Supply Requests, Weekly tab
    reset: weekly
    notes: Same window, Weekly tab. Cap 1 = "did some", partial is fine. Check the Boss tab before salvaging field boss gear. Resets at the normal weekly reset (in-game 2026-10-18).

  - id: halloween
    name: Halloween weekly quests (event, until 2026-11-04)
    reset: weekly
    notes: Claim the 10 weekly event quests (235 Pumpkin Coins/week, per server). List in knowledge/events.md (in-game 2026-10-14). Spend - chest (250, once) first, then Shugo keys, Nightmare tickets, Daily Dungeon clears, Odyle Energy; weekly limits don't carry over. Remove after the event.

  - id: invasion
    name: Dimensional Invasion (use key)
    reset: daily
    notes: Every hour at :30, ~5 min. Only worth it with a key (no key = no rewards, in-game). +1 key/day, banks to 7.

  # PvP (second priority since 2026-10-19). Example build: players/chris/characters/dhamira-build.md "PvP preset".
  - id: arena-solo
    name: Arena of Solitude (1v1)
    notes: Arena window, matchmaking always open. 300 AP per match, 500 AP per win (in-game 2026-10-18). Weekly reward limit 10 participation + 30 victory, Wed reset. Cap 10 = participation rewards; log every match played here, wins additionally as arena-solo-win. Best test of the PvP preset. Details knowledge/endgame.md "Arena". Season 1 weekly achievements (guides, probably both arenas count) - Steady Efforts 3/7/10 matches (70 Soul Crystals), Me, Beyond Myself 1/3/5 wins.
    reset: weekly
    cap: 10

  - id: arena-solo-win
    name: Arena of Solitude wins
    notes: Victory reward limit 30/week (500 AP each) (in-game 2026-10-18). Log wins only; the same matches also go into arena-solo.
    reset: weekly
    cap: 30

  - id: arena-team
    name: Arena of Cooperation (5v5)
    notes: Same window and rewards as arena-solo, separate limit (in-game 2026-10-18). Cap 10 = participation rewards; log every match played here, wins additionally as arena-team-win.
    reset: weekly
    cap: 10

  - id: arena-team-win
    name: Arena of Cooperation wins
    notes: Victory reward limit 30/week (500 AP each) (in-game 2026-10-18). Log wins only; the same matches also go into arena-team.
    reset: weekly
    cap: 30

  - id: abyss-time
    name: Abyss time (Lower Reshanta)
    notes: 7h/week, runs only while inside, also while dead (in-game 2026-10-18). Log hours spent as ×n (round to whole hours). Unused hours do NOT carry over; the weekly reset refills it to 7h (in-game 2026-10-19), so use it before Wednesday. Rift Stones add +1h (guide). Use it for Abyss commands, corridor, open-world PvP. Season 1 weekly achievements (guides) - Hometown of My Heart at 1h; Purify Reshanta at 200…2,000 Abyss monster kills (10 tiers, the biggest weekly, 5,780 Oath Coins + 10k AP total), comes with the time spent here.
    reset: weekly
    cap: 7

  # Season 1 weekly achievements without a routine of their own (until 2026-12-16). Others are noted on
  # nightmare, ascension, abyss-commands, battlefield, arena-solo, abyss-time. List: knowledge/achievements.md.
  - id: transcendence
    name: Transcendence clears
    notes: Deus Research Base / Shattered Arkanis, party 2–5. No daily entry limit (in-game 2026-10-23); shares the 10 unobtained cubes/week with Conquest (in-game, knowledge/transcendence.md). Cap 10 = top tier of weekly achievement Way of the Transcended (3/6/10 clears, 5,700 Oath Coins total). Same week also - one clear without dying, one under 15 min, 10 mini-bosses, extract 10 Arcana (guides).
    reset: weekly
    cap: 10

  - id: abyss-boss
    name: Abyss boss kills
    notes: Weekly achievement Daeva of Extraordinary Deeds at 1/3/5 Abyss bosses (820 Oath Coins + 6,000 AP + 3 Silver Medals), plus per-boss ones - Watcher Kaira 1/5/10, Argo 1/3, Nahma 1 (guides). Timers in knowledge/abyss.md.
    reset: weekly
    cap: 5

  - id: abyss-odyle
    name: Gather Odyle in the Abyss
    notes: Weekly Season Mission, Challenge tab - gather Odyle in the Abyss, chain 10/20/30 (in-game 2026-10-23). Rewards per guides (Daeva of Enduring Deeds) - 820 Oath Coins + 6,000 AP + 3 Silver Medals. Log the amount gathered as ×n.
    reset: weekly
    cap: 30

  - id: season-claim
    name: Claim Season 1 achievement rewards
    notes: Rewards are claimed by hand (Collect All Rewards, in-game 2026-10-18). Check Achievements → Season 1 before the Wednesday reset so nothing finished stays unclaimed.
    reset: weekly
